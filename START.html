<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2.5' y='1.5' width='11' height='13' rx='1' fill='%23fff' stroke='%23888'/%3E%3Cpath d='M5 5h6M5 8h6M5 11h4' stroke='%23888'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app/launcher.css">
</head>
<body>
<header>
  <h1>LIBRARY</h1>
  <select id="layout" title="Library layout"><option value="steam">Steam-style</option><option value="ps">PlayStation-style</option><option value="xbox">Xbox-style</option></select>
  <input id="search" type="search" placeholder="Search games" autocomplete="off">
  <select id="sort"><option value="az">A–Z</option><option value="recent">Recently played</option></select>
  <button id="fav" title="Favorites only">★</button>
  <span id="msg"></span>
  <button id="usb">Connect USB</button>
  <button id="rescan">Rescan</button>
  <button id="export">Export</button>
  <button id="import">Import</button>
  <input id="importFile" type="file" accept=".js" hidden>
</header>

<main id="home">
  <aside id="side"></aside>
  <div id="shelves">
    <section id="recentWrap"><h2>Recent games</h2><div id="recent" class="shelf"></div></section>
    <h2>All games <span id="count"></span></h2>
    <div id="grid" class="grid"></div>
  </div>
  <section id="console" hidden></section>
  <p id="empty" hidden>No games found. Run REBUILD-LIBRARY.bat (or Connect USB → Rescan), then press F5.</p>
</main>

<div id="player" hidden>
  <iframe id="game" title="game"></iframe>
  <div id="pause" hidden>
    <div class="panel">
      <h3 id="ptitle"></h3>
      <div class="btns">
        <button id="resume" class="play">Resume</button>
        <button id="restart">Restart</button>
        <button id="exit">Exit to library</button>
      </div>
      <table id="controls"></table>
      <p class="hint">Esc resume · F fullscreen · ` hide screen</p>
    </div>
  </div>
</div>

<div id="boss" hidden><textarea id="notes" spellcheck="false"></textarea></div>

<script src="data/library.js"></script>
<script src="data/saves.js"></script>
<script src="app/launcher.js"></script>
</body>
</html>
